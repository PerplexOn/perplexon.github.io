<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Plinky Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Boldonse&family=Red+Hat+Mono:wght@400;600;700&display=swap" rel="stylesheet">
<style>
/* ===== Design tokens (Plinky//12 series: ink / paper / signal red) ===== */
:root {
  --ink: #141414;
  --ink-2: #1e1e1e;
  --ink-3: #2a2a2a;
  --paper: #E6E6E3;
  --paper-dim: #9a9a96;
  --red: #FF3A1F;
  --hair: rgba(230,230,227,.18);
  --mono: "Red Hat Mono", ui-monospace, Menlo, monospace;
  --display: "Boldonse", "Arial Black", sans-serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--ink); overflow: hidden; }
/* #app covers the whole viewport on top of anything a host page/theme injects */
#app { position: fixed; inset: 0; z-index: 2147483000; background: var(--ink); color: var(--paper);
  font-family: var(--mono); font-size: 13px; line-height: 1.2; overflow: hidden; touch-action: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
#app, #app * { font-family: var(--mono); }
#app button, #app select { margin: 0; box-shadow: none; text-shadow: none; line-height: 1.2; }

/* ===== Header ===== */
#app .hdr { position: absolute; top: 0; left: 0; right: 0; height: 52px; margin: 0; display: flex; align-items: center; gap: 10px;
  padding: 0 max(16px, env(safe-area-inset-left)); border-bottom: 1px solid var(--hair); }
.tag { background: var(--paper); color: var(--ink); font-weight: 700; font-size: 12px;
  padding: 4px 8px; letter-spacing: .08em; white-space: nowrap; }
.tabs { display: flex; gap: 0; margin-left: 6px; }
.tab { background: transparent; color: var(--paper-dim); border: 1px solid var(--hair);
  padding: 8px 16px; font-size: 13px; font-weight: 700; letter-spacing: .1em; }
.tab.on { background: var(--paper); color: var(--ink); border-color: var(--paper); }
.spacer { flex: 1; }
.midi { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--paper-dim); }
.midi select { background: var(--ink-2); color: var(--paper); border: 1px solid var(--hair);
  font-size: 11px; padding: 5px 4px; max-width: 150px; border-radius: 0; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ink-3); border: 1px solid var(--paper-dim); }
.dot.ok { background: var(--paper); border-color: var(--paper); }
.dot.hit { background: var(--red); border-color: var(--red); }

#app .main { position: absolute; top: 52px; left: 0; right: 0; bottom: 0; }
.page { position: absolute; inset: 0; display: none; }
.page.on { display: block; }

/* ===== Sound page ===== */
#sound { display: none; padding: 14px max(16px, env(safe-area-inset-right)) 14px max(16px, env(safe-area-inset-left)); }
#sound.on { display: grid; grid-template-columns: 1fr 320px; gap: 16px; }
.faders { display: grid; grid-template-columns: repeat(11, minmax(0,1fr)); grid-template-rows: 1fr 1fr; gap: 14px 6px; min-height: 0; }
.fader { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.grp { font-size: 9px; height: 14px; color: var(--red); letter-spacing: .12em; font-weight: 700;
  border-top: 1px solid var(--hair); padding-top: 2px; white-space: nowrap; overflow: visible; }
.grp.first { border-top-color: var(--paper); }
.track { position: relative; flex: 1; margin: 4px 0; background: var(--ink-2);
  border: 1px solid var(--hair); overflow: hidden; touch-action: none; }
.fill { position: absolute; left: 0; right: 0; background: var(--paper); }
.fader.touch .fill { background: var(--red); }
.mid { position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: var(--paper-dim); opacity: .5; }
.val { font-size: 12px; font-weight: 700; text-align: center; }
.lbl { font-size: 9px; text-align: center; color: var(--paper-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: .04em; }

.side { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.sect { font-size: 10px; letter-spacing: .14em; color: var(--paper-dim); display: flex; gap: 8px; align-items: center; }
.sect b { background: var(--paper); color: var(--ink); padding: 2px 6px; }
#xy { position: relative; width: 100%; aspect-ratio: 1; background: var(--ink-2); border: 1px solid var(--hair); touch-action: none; overflow: hidden; }
#xy .h, #xy .v { position: absolute; background: var(--paper); opacity: .7; }
#xy .h { left: 0; right: 0; height: 1px; }
#xy .v { top: 0; bottom: 0; width: 1px; }
#xy .knob { position: absolute; width: 26px; height: 26px; margin: -13px 0 0 -13px; border: 2px solid var(--paper); }
#xy.touch .knob { border-color: var(--red); background: rgba(255,58,31,.25); }
#xy .read { position: absolute; left: 6px; bottom: 4px; font-size: 10px; color: var(--paper-dim); }
.presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.btn { background: var(--ink-2); color: var(--paper); border: 1px solid var(--hair);
  font-size: 12px; font-weight: 700; padding: 12px 0; letter-spacing: .08em; border-radius: 0; }
.btn.has { border-color: var(--paper-dim); }
.btn.cur { background: var(--paper); color: var(--ink); }
.btn.arm { background: var(--red); border-color: var(--red); color: var(--ink); }
.row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
.hint { font-size: 10px; color: var(--paper-dim); line-height: 1.5; }

/* ===== Visual page ===== */
#stage { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.ov { position: absolute; top: 12px; display: flex; gap: 6px; z-index: 2; }
.ov.l { left: max(12px, env(safe-area-inset-left)); }
.ov.r { right: max(12px, env(safe-area-inset-right)); }
.ov .btn { padding: 8px 12px; font-size: 11px; background: rgba(20,20,20,.75); }
.ov .btn.cur { background: var(--red); border-color: var(--red); color: var(--ink); }
body.hide .hdr { display: none; }
body.hide .main { top: 0; }
body.hide .ov { opacity: 0; }
body.hide .ov.r { opacity: .25; }
body.hide .ov.r .btn:not(#bHide) { display: none; }

@media (max-width: 900px) {
  #sound.on { grid-template-columns: 1fr; overflow-y: auto; }
  .faders { grid-template-columns: repeat(6, minmax(0,1fr)); grid-template-rows: none; grid-auto-rows: 210px; }
  .midi select { max-width: 90px; }
}
</style>
</head>
<body>
<div id="app">
<header class="hdr">
  <span class="tag">PLINKY//12</span>
  <div class="tabs">
    <button class="tab on" data-p="sound">SOUND</button>
    <button class="tab" data-p="visual">VISUAL</button>
  </div>
  <div class="spacer"></div>
  <div class="midi">
    <span class="dot" id="dot"></span>
    <span id="status">NO MIDI</span>
    <select id="selIn" title="MIDI in"></select>
    <select id="selOut" title="MIDI out"></select>
    <select id="selCh" title="Channel"></select>
  </div>
</header>

<main class="main">
  <section class="page on" id="sound">
    <div class="faders" id="faders"></div>
    <div class="side">
      <div class="sect"><b>XY</b> CC 1 / CC 2</div>
      <div id="xy"><div class="h"></div><div class="v"></div><div class="knob"></div><div class="read">X 064 · Y 064</div></div>
      <div class="sect"><b>PRESETS</b> TAP = LOAD</div>
      <div class="presets" id="presets"></div>
      <div class="row">
        <button class="btn" id="bSave">SAVE</button>
        <button class="btn" id="bInit">INIT</button>
        <button class="btn" id="bSend">SEND ALL</button>
      </div>
      <div class="hint">Drag faders up/down · double-tap resets · Plinky sends CC feedback only while transport runs.</div>
    </div>
  </section>

  <section class="page" id="visual">
    <canvas id="stage"></canvas>
    <div class="ov l" id="scenes"></div>
    <div class="ov r">
      <button class="btn" id="bPal">DUSK</button>
      <button class="btn" id="bDemo">DEMO</button>
      <button class="btn" id="bHide">HIDE UI</button>
    </div>
  </section>
</main>
</div>

<script>
"use strict";
// =====================================================================
// CONFIG
// =====================================================================
// Voice params: index = CC offset. Low value CC = 16 + index.
// init: value sent by INIT (adjust to taste / to Plinky defaults).
// bi: bipolar (center = 64).
const PARAMS = [
  // row 1
  { i: 0,  n: "HP CUT",   g: "FILTER", init: 0 },
  { i: 1,  n: "LP CUT",   g: "FILTER", init: 100 },
  { i: 2,  n: "RESO",     g: "FILTER", init: 24 },
  { i: 3,  n: "ATTACK",   g: "ENV",    init: 0 },
  { i: 4,  n: "DECAY",    g: "ENV",    init: 50 },
  { i: 5,  n: "SUSTAIN",  g: "ENV",    init: 110 },
  { i: 6,  n: "RELEASE",  g: "ENV",    init: 30 },
  { i: 7,  n: "GLIDE",    g: "PITCH",  init: 0 },
  { i: 8,  n: "PITCH",    g: "PITCH",  init: 0 },   // neutral at bottom (mid = +1 oct)
  { i: 9,  n: "OCTAVE",   g: "PITCH",  init: 0 },
  { i: 15, n: "TOAD",     g: "TOAD",   init: 0 },
  // row 2
  { i: 10, n: "NOISE|SUB", g: "TONE",  init: 64, bi: true },
  { i: 11, n: "SAT|FOLD",  g: "TONE",  init: 64, bi: true },
  { i: 12, n: "STEREO",   g: "SPACE",  init: 64 },
  { i: 13, n: "DELAY",    g: "SPACE",  init: 0 },
  { i: 14, n: "REVERB",   g: "SPACE",  init: 30 },
  { i: 20, n: "CHORUS",   g: "SPACE",  init: 64, bi: true },
  { i: 17, n: "STRETCH",  g: "SAMPLE", init: 0 },
  { i: 18, n: "START",    g: "SAMPLE", init: 0 },
  { i: 19, n: "LENGTH",   g: "SAMPLE", init: 127 },
  { i: 21, n: "SIDECHAIN", g: "OUT",   init: 64, bi: true },
  { i: 16, n: "VOLUME",   g: "OUT",    init: 100 },
];
const CC_BASE = 16, CC_X = 1, CC_Y = 2;
const STORE_KEY = "plinkyCompanion.v1";

// =====================================================================
// STATE
// =====================================================================
const S = {
  vals: new Array(22).fill(0),
  x: 64, y: 64,
  touching: new Set(),      // param indices currently under a finger
  presets: new Array(8).fill(null),
  curPreset: -1,
  saveArmed: false,
  chan: 1,
  out: null,
  inSel: "all",
  pending: new Map(),       // cc -> value, flushed once per frame
};
PARAMS.forEach(p => S.vals[p.i] = p.init);

function load() {
  try {
    const d = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if (d && Array.isArray(d.presets)) S.presets = d.presets.slice(0, 8);
    if (d && d.chan) S.chan = d.chan;
  } catch (e) {}
}
function persist() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify({ presets: S.presets, chan: S.chan })); } catch (e) {}
}
load();

// =====================================================================
// MIDI
// =====================================================================
let midi = null;
const dot = document.getElementById("dot");
const statusEl = document.getElementById("status");
const selIn = document.getElementById("selIn");
const selOut = document.getElementById("selOut");
const selCh = document.getElementById("selCh");

for (let c = 1; c <= 16; c++) selCh.add(new Option("CH " + c, c));
selCh.value = S.chan;
selCh.onchange = () => { S.chan = +selCh.value; persist(); };

function sendCC(cc, v) {
  if (!S.out) return;
  const msg = [0xB0 | (S.chan - 1), cc & 127, v & 127];
  try { S.out.send(msg); } catch (e) {}
  V.raw(msg);
}
function queueCC(cc, v) { S.pending.set(cc, v); }
function flushCC() {
  if (!S.pending.size) return;
  S.pending.forEach((v, cc) => sendCC(cc, v));
  S.pending.clear();
}

function refreshPorts() {
  if (!midi) return;
  const prevIn = selIn.value || "all", prevOut = selOut.value;
  selIn.innerHTML = ""; selOut.innerHTML = "";
  selIn.add(new Option("IN: ALL", "all"));
  let auto = null;
  midi.inputs.forEach(p => {
    selIn.add(new Option("IN: " + p.name, p.id));
    p.onmidimessage = onMidi;
  });
  selOut.add(new Option("OUT: —", ""));
  midi.outputs.forEach(p => {
    selOut.add(new Option("OUT: " + p.name, p.id));
    if (!auto && /plinky/i.test(p.name)) auto = p.id;
  });
  selIn.value = [...selIn.options].some(o => o.value === prevIn) ? prevIn : "all";
  const outId = prevOut && midi.outputs.get(prevOut) ? prevOut : (auto || (midi.outputs.size ? midi.outputs.values().next().value.id : ""));
  selOut.value = outId;
  S.out = outId ? midi.outputs.get(outId) : null;
  S.inSel = selIn.value;
  const n = midi.inputs.size;
  dot.className = "dot" + (n ? " ok" : "");
  statusEl.textContent = n ? (S.out ? "LINKED" : "IN ONLY") : "NO DEVICE";
}
selIn.onchange = () => { S.inSel = selIn.value; };
selOut.onchange = () => { S.out = selOut.value ? midi.outputs.get(selOut.value) : null; refreshPorts(); };

if (navigator.requestMIDIAccess) {
  navigator.requestMIDIAccess({ sysex: true })        // sysex lets panels push their palette
    .catch(() => navigator.requestMIDIAccess({ sysex: false }))
    .then(m => {
    midi = m; m.onstatechange = refreshPorts; refreshPorts();
  }).catch(() => { statusEl.textContent = "MIDI DENIED"; setTimeout(() => setDemo(true)); });
} else {
  statusEl.textContent = "NO WEB MIDI";
  setTimeout(() => setDemo(true));   // deferred: demo UI is defined further down
}

let hitT = 0;
function onMidi(e) {
  if (S.inSel !== "all" && e.target.id !== S.inSel) return;
  const d = e.data, st = d[0];
  hitT = performance.now();
  if (st === 0xF0) { onSysex(d); return; }
  if (st === 0xF8) { V.clockTick(); return; }
  if (st === 0xFA) { V.clockStart(); return; }
  if (st === 0xFC) { V.clockStop(); return; }
  const type = st & 0xF0, ch = (st & 0x0F) + 1;
  if (type === 0x90 && d[2] > 0) V.noteOn(d[1], d[2], ch);
  else if (type === 0x80 || (type === 0x90 && d[2] === 0)) V.noteOff(d[1], ch);
  else if (type === 0xB0) {
    V.raw([st, d[1], d[2]]);
    if (ch !== S.chan) return;
    const cc = d[1], v = d[2];
    if (cc >= CC_BASE && cc < CC_BASE + 22) {
      const i = cc - CC_BASE;
      if (!S.touching.has(i)) { S.vals[i] = v; renderFader(i); }
    } else if (cc === CC_X && !xyTouch) { S.x = v; renderXY(); }
    else if (cc === CC_Y && !xyTouch) { S.y = v; renderXY(); }
  } else if (type === 0xC0) {
    V.raw([st, d[1]]);
    setScene(d[1] % SCENES.length);
  }
}

// =====================================================================
// SOUND PAGE
// =====================================================================
const fadersEl = document.getElementById("faders");
const faderEls = {};
let lastGroup = null, col = 0;
PARAMS.forEach((p, k) => {
  const rowStart = k % 11 === 0;
  const showGrp = rowStart || p.g !== lastGroup;
  lastGroup = p.g;
  const el = document.createElement("div");
  el.className = "fader";
  el.innerHTML =
    `<div class="grp${showGrp ? " first" : ""}">${showGrp ? p.g : ""}</div>` +
    `<div class="track"><div class="fill"></div>${p.bi ? '<div class="mid"></div>' : ""}</div>` +
    `<div class="val">000</div><div class="lbl">${p.n}</div>`;
  fadersEl.appendChild(el);
  faderEls[p.i] = { el, fill: el.querySelector(".fill"), val: el.querySelector(".val"), track: el.querySelector(".track"), p };
  attachFader(p, el.querySelector(".track"));
});

function renderFader(i) {
  const f = faderEls[i]; if (!f) return;
  const v = S.vals[i], t = v / 127;
  if (f.p.bi) {
    const c = 0.5;
    const top = Math.min(t, c), bot = Math.max(t, c);
    f.fill.style.bottom = (top * 100) + "%";
    f.fill.style.height = Math.max((bot - top) * 100, 0.8) + "%";
    const b = v - 64;
    f.val.textContent = (b > 0 ? "+" : b < 0 ? "−" : "±") + String(Math.abs(b)).padStart(2, "0");
  } else {
    f.fill.style.bottom = "0";
    f.fill.style.height = (t * 100) + "%";
    f.val.textContent = String(v).padStart(3, "0");
  }
}

function attachFader(p, track) {
  let startY = 0, startV = 0, id = null, lastDown = 0;
  track.addEventListener("pointerdown", e => {
    e.preventDefault();
    const now = performance.now();
    if (now - lastDown < 300) { setParam(p.i, p.init); lastDown = 0; return; }
    lastDown = now;
    id = e.pointerId; track.setPointerCapture(id);
    startY = e.clientY; startV = S.vals[p.i];
    S.touching.add(p.i); faderEls[p.i].el.classList.add("touch");
  });
  track.addEventListener("pointermove", e => {
    if (e.pointerId !== id) return;
    const h = track.clientHeight || 1;
    const v = Math.round(startV + (startY - e.clientY) / h * 127);
    setParam(p.i, v);
  });
  const end = e => {
    if (e.pointerId !== id) return;
    id = null; S.touching.delete(p.i); faderEls[p.i].el.classList.remove("touch");
  };
  track.addEventListener("pointerup", end);
  track.addEventListener("pointercancel", end);
}

function setParam(i, v) {
  v = Math.max(0, Math.min(127, v | 0));
  if (S.vals[i] === v) return;
  S.vals[i] = v; renderFader(i); queueCC(CC_BASE + i, v);
  markDirty();
}

// XY pad
const xyEl = document.getElementById("xy");
const xyH = xyEl.querySelector(".h"), xyV = xyEl.querySelector(".v"), xyK = xyEl.querySelector(".knob"), xyR = xyEl.querySelector(".read");
let xyTouch = false;
function renderXY() {
  const px = S.x / 127 * 100, py = (1 - S.y / 127) * 100;
  xyV.style.left = px + "%"; xyH.style.top = py + "%";
  xyK.style.left = px + "%"; xyK.style.top = py + "%";
  xyR.textContent = `X ${String(S.x).padStart(3, "0")} · Y ${String(S.y).padStart(3, "0")}`;
}
function xyFrom(e) {
  const r = xyEl.getBoundingClientRect();
  const x = Math.round(Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * 127);
  const y = Math.round(Math.max(0, Math.min(1, 1 - (e.clientY - r.top) / r.height)) * 127);
  if (x !== S.x) { S.x = x; queueCC(CC_X, x); }
  if (y !== S.y) { S.y = y; queueCC(CC_Y, y); }
  renderXY(); markDirty();
}
xyEl.addEventListener("pointerdown", e => { e.preventDefault(); xyTouch = true; xyEl.classList.add("touch"); xyEl.setPointerCapture(e.pointerId); xyFrom(e); });
xyEl.addEventListener("pointermove", e => { if (xyTouch) xyFrom(e); });
const xyEnd = () => { xyTouch = false; xyEl.classList.remove("touch"); };
xyEl.addEventListener("pointerup", xyEnd);
xyEl.addEventListener("pointercancel", xyEnd);

// Presets
const presetsEl = document.getElementById("presets");
const bSave = document.getElementById("bSave");
const presetBtns = [];
for (let k = 0; k < 8; k++) {
  const b = document.createElement("button");
  b.className = "btn"; b.textContent = String(k + 1).padStart(2, "0");
  b.onclick = () => {
    if (S.saveArmed) {
      S.presets[k] = { vals: S.vals.slice(), x: S.x, y: S.y };
      S.curPreset = k; S.saveArmed = false; persist();
    } else if (S.presets[k]) {
      const pr = S.presets[k];
      pr.vals.forEach((v, i) => { S.vals[i] = v; renderFader(i); });
      S.x = pr.x; S.y = pr.y; renderXY();
      sendAll(); S.curPreset = k;
    }
    renderPresets();
  };
  presetsEl.appendChild(b); presetBtns.push(b);
}
function renderPresets() {
  presetBtns.forEach((b, k) => {
    b.className = "btn" + (S.presets[k] ? " has" : "") + (k === S.curPreset ? " cur" : "") + (S.saveArmed ? " arm" : "");
  });
  bSave.className = "btn" + (S.saveArmed ? " arm" : "");
}
function markDirty() { if (S.curPreset >= 0) { S.curPreset = -1; renderPresets(); } }
function sendAll() {
  PARAMS.forEach(p => queueCC(CC_BASE + p.i, S.vals[p.i]));
  queueCC(CC_X, S.x); queueCC(CC_Y, S.y);
}
bSave.onclick = () => { S.saveArmed = !S.saveArmed; renderPresets(); };
document.getElementById("bInit").onclick = () => {
  PARAMS.forEach(p => { S.vals[p.i] = p.init; renderFader(p.i); });
  S.x = 64; S.y = 64; renderXY(); sendAll(); markDirty();
};
document.getElementById("bSend").onclick = sendAll;

PARAMS.forEach(p => renderFader(p.i));
renderXY(); renderPresets();

// Tabs
document.querySelectorAll(".tab").forEach(t => t.onclick = () => {
  document.querySelectorAll(".tab").forEach(x => x.classList.toggle("on", x === t));
  document.querySelectorAll(".page").forEach(pg => pg.classList.toggle("on", pg.id === t.dataset.p));
  resize();
});

// =====================================================================
// VISUAL ENGINE
// =====================================================================
const cv = document.getElementById("stage");
const ctx = cv.getContext("2d");
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const r = cv.getBoundingClientRect();
  W = Math.max(1, r.width); H = Math.max(1, r.height);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  SCENES.forEach(s => s.reset && s.reset());
}
window.addEventListener("resize", resize);

const INK = "#141414", PAPER = "#E6E6E3", RED = "#FF3A1F";
const NOTE_NAMES = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
const noteName = n => NOTE_NAMES[n % 12] + (Math.floor(n / 12) - 1);
const pv = i => S.vals[i] / 127;                 // unipolar 0..1
const bp = i => (S.vals[i] - 64) / 64;           // bipolar -1..1
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);

// Envelope times follow the Sound page (attack / release faders)
const attackTime = () => 0.004 + pv(3) * pv(3) * 1.5;
const releaseTime = () => 0.06 + pv(6) * pv(6) * 3.0;

const V = {
  notes: new Map(),     // key "ch:n" -> {n, v, ch, t0, rel}
  log: [],              // recent events for readouts
  echoes: [],           // scheduled delay echoes
  beat: 0, beatT: -10, ticks: 0, bpm: 0, lastBeatMs: 0, running: false,
  now: 0,
  noteOn(n, vel, ch, echo) {
    const v = vel / 127, t = this.now;
    if (!echo) {
      this.notes.set(ch + ":" + n, { n, v, ch, t0: t, rel: null });
      this.log.unshift({ n, v, ch, t }); if (this.log.length > 9) this.log.pop();
      this.raw([0x90 | ((ch - 1) & 15), n & 127, vel & 127]);
      // delay send -> visual echoes
      const reps = Math.floor(pv(13) * 4.99);
      const dt = this.bpm ? 30 / this.bpm : 0.25;   // eighth note
      for (let k = 1; k <= reps; k++) this.echoes.push({ n, v: v * Math.pow(0.6, k), ch, at: t + dt * k });
    }
    SCENES[cur].spawn({ n, v, ch, t, echo: !!echo });
  },
  noteOff(n, ch) {
    const k = ch + ":" + n, o = this.notes.get(k);
    if (o && o.rel === null) o.rel = this.now;
    this.raw([0x80 | ((ch - 1) & 15), n & 127, 0]);
  },
  raw(b) { const sc = SCENES[cur]; if (sc && sc.onRaw) sc.onRaw(b); },
  level(o) {
    const t = this.now;
    let a = clamp((t - o.t0) / attackTime(), 0, 1);
    if (o.rel !== null) a *= clamp(1 - (t - o.rel) / releaseTime(), 0, 1);
    return a * o.v;
  },
  clockTick() {
    this.ticks++;
    if (this.ticks % 24 === 0) {
      const ms = performance.now();
      if (this.lastBeatMs) this.bpm = this.bpm ? this.bpm * 0.8 + (60000 / (ms - this.lastBeatMs)) * 0.2 : 60000 / (ms - this.lastBeatMs);
      this.lastBeatMs = ms; this.beatNow();
    }
  },
  clockStart() { this.ticks = 0; this.running = true; this.beatNow(); },
  clockStop() { this.running = false; },
  beatNow() { this.beat++; this.beatT = this.now; SCENES[cur].onBeat && SCENES[cur].onBeat(); },
  update() {
    const t = this.now;
    for (let k = this.echoes.length - 1; k >= 0; k--) {
      const e = this.echoes[k];
      if (t >= e.at) { this.echoes.splice(k, 1); this.noteOn(e.n, e.v * 127, e.ch, true); }
    }
    this.notes.forEach((o, k) => { if (o.rel !== null && t - o.rel > releaseTime()) this.notes.delete(k); });
  },
};

// pitch -> position helpers
const pitchX = n => 0.06 + ((n - 24) / 72) * 0.88;     // C1..C7 across
const pad2 = v => String(v).padStart(2, "0");
const pad3 = v => String(v).padStart(3, "0");
const hex2 = b => (b & 255).toString(16).toUpperCase().padStart(2, "0");
function describe(b) {
  const type = b[0] & 0xF0, ch = (b[0] & 15) + 1;
  if (type === 0x90) return `NOTE ON · ${noteName(b[1])} · VEL ${pad3(b[2])} · CH${pad2(ch)}`;
  if (type === 0x80) return `NOTE OFF · ${noteName(b[1])} · CH${pad2(ch)}`;
  if (type === 0xB0) return `CC ${pad3(b[1])} = ${pad3(b[2])} · CH${pad2(ch)}`;
  if (type === 0xC0) return `PROGRAM ${pad3(b[1])} · CH${pad2(ch)}`;
  return "DATA";
}
// shared bottom readout for the dark scenes
function readout(fg) {
  ctx.font = "600 11px 'Red Hat Mono', monospace"; ctx.textBaseline = "top"; ctx.fillStyle = fg;
  const e = V.log[0];
  ctx.fillText(e ? `${noteName(e.n)} / ${pad3(Math.round(e.v * 127))} / CH${e.ch}` : "WAITING FOR SIGNAL", 24, H - 60);
  ctx.fillText(`LP ${pad3(S.vals[1])}  RES ${pad3(S.vals[2])}  FOLD ${String(S.vals[11] - 64).padStart(3, " ")}  XY ${S.x}.${S.y}  ${V.bpm ? Math.round(V.bpm) + " BPM" : "NO CLOCK"}`, 24, H - 42);
  ctx.fillStyle = V.now - V.beatT < 0.1 ? RED : fg;
  ctx.fillRect(W - 40, H - 58, 14, 14);
}

// ---------------------------------------------------------------------
// SCENE 01 — EVENTS (paper: dominant note + voices, functional XY pad)
// ---------------------------------------------------------------------
const sceneEvents = {
  name: "EVENTS",
  pad: null, drag: null,
  reset() { if (this.drag !== null) { this.drag = null; xyTouch = false; } },
  spawn() {},
  pointer(type, e, x, y) {
    if (type === "down") {
      const p = this.pad;
      if (!p || x < p.x || x > p.x + p.s || y < p.y || y > p.y + p.s) return false;
      this.drag = e.pointerId; xyTouch = true; this.setXY(x, y); return true;
    }
    if (e.pointerId !== this.drag) return false;
    if (type === "move") this.setXY(x, y);
    else { this.drag = null; xyTouch = false; }
    return true;
  },
  setXY(x, y) {
    const p = this.pad;
    const nx = Math.round(clamp((x - p.x) / p.s, 0, 1) * 127);
    const ny = Math.round(clamp(1 - (y - p.y) / p.s, 0, 1) * 127);
    if (nx !== S.x) { S.x = nx; queueCC(CC_X, nx); }
    if (ny !== S.y) { S.y = ny; queueCC(CC_Y, ny); }
    renderXY(); markDirty();
  },
  draw() {
    const t = V.now, m = 32, top = 84;
    ctx.fillStyle = PAPER; ctx.fillRect(0, 0, W, H);
    // XY pad on the right, square
    const ps = Math.max(160, Math.min(H - top - m, W * 0.42));
    const px = W - m - ps, py = top + Math.max(0, (H - top - m - ps) / 2);
    this.pad = { x: px, y: py, s: ps };
    const lw = px - m * 3;

    // 01 NOTE — last event, huge
    let y = top;
    tag(m, y, "01 NOTE"); y += 34;
    const e = V.log[0], fresh = e && t - e.t < 0.15;
    const fs = Math.max(40, Math.min((H - top) * 0.24, lw * 0.28));
    ctx.textBaseline = "alphabetic"; ctx.fillStyle = fresh ? RED : INK;
    ctx.font = `${fs}px Boldonse, 'Arial Black', sans-serif`;
    const label = e ? noteName(e.n) : "—";
    const mt = ctx.measureText(label);                 // place by real glyph bounds (Boldonse metrics are unusual)
    const asc = mt.actualBoundingBoxAscent || fs * 0.75, desc = mt.actualBoundingBoxDescent || 0;
    ctx.fillText(label, m - 3, y + asc);
    ctx.textBaseline = "top";
    y += asc + desc + 26;
    ctx.font = "700 15px 'Red Hat Mono', monospace"; ctx.fillStyle = INK;
    ctx.fillText(e ? `VEL ${pad3(Math.round(e.v * 127))}   CH${pad2(e.ch)}   MIDI ${pad3(e.n)}` : "WAITING FOR SIGNAL", m, y);
    y += 26;
    ctx.fillStyle = "rgba(20,20,20,.12)"; ctx.fillRect(m, y, lw, 12);
    if (e) { ctx.fillStyle = fresh ? RED : INK; ctx.fillRect(m, y, lw * e.v, 12); }
    y += 40;

    // 02 VOICES — held / releasing notes with live envelope level
    const vs = [...V.notes.values()].sort((a, b) => b.t0 - a.t0).slice(0, 8);
    tag(m, y, `02 VOICES  ${pad2(V.notes.size)}`); y += 32;
    const rowH = clamp((H - y - m) / 8, 16, 40);
    const fsz = Math.round(rowH * 0.5), bx = m + fsz * 3.2, bw = lw - (bx - m) - fsz * 2.6;
    ctx.font = `700 ${fsz}px 'Red Hat Mono', monospace`;
    for (let k = 0; k < 8; k++) {
      const yy = y + k * rowH, o = vs[k], by = yy + rowH * 0.28, bh = rowH * 0.44;
      ctx.fillStyle = "rgba(20,20,20,.1)"; ctx.fillRect(bx, by, bw, bh);
      if (!o) continue;
      const lv = V.level(o);
      ctx.fillStyle = o.rel === null ? INK : "rgba(20,20,20,.4)";
      ctx.fillText(noteName(o.n), m, yy + rowH * 0.25);
      ctx.fillText(pad3(Math.round(o.v * 127)), bx + bw + fsz * 0.6, yy + rowH * 0.25);
      ctx.fillStyle = t - o.t0 < 0.12 ? RED : (o.rel === null ? INK : "rgba(20,20,20,.4)");
      ctx.fillRect(bx, by, bw * clamp(lv / Math.max(o.v, 0.01), 0, 1), bh);
    }

    // 03 XY — functional: drag sends CC 1 / CC 2 like the Plinky XY pad
    tag(px, py - 26, "03 XY   CC1 / CC2");
    ctx.lineWidth = 2; ctx.strokeStyle = INK; ctx.strokeRect(px, py, ps, ps);
    ctx.lineWidth = 1; ctx.strokeStyle = "rgba(20,20,20,.18)";
    ctx.beginPath();
    for (let q = 1; q < 4; q++) {
      ctx.moveTo(px + ps * q / 4, py); ctx.lineTo(px + ps * q / 4, py + ps);
      ctx.moveTo(px, py + ps * q / 4); ctx.lineTo(px + ps, py + ps * q / 4);
    }
    ctx.stroke();
    const cx = px + S.x / 127 * ps, cy = py + (1 - S.y / 127) * ps;
    const live = xyTouch;
    ctx.fillStyle = live ? RED : INK;
    ctx.fillRect(px, cy - 0.5, ps, 1); ctx.fillRect(cx - 0.5, py, 1, ps);
    if (live) { ctx.fillStyle = "rgba(255,58,31,.25)"; ctx.fillRect(cx - 18, cy - 18, 36, 36); }
    xBox(cx, cy, 14);
    ctx.font = "700 13px 'Red Hat Mono', monospace"; ctx.textBaseline = "top"; ctx.fillStyle = INK;
    ctx.fillText(`X ${pad3(S.x)} · Y ${pad3(S.y)}`, px + 10, py + ps - 24);
    ctx.fillStyle = t - V.beatT < 0.12 ? RED : INK;
    ctx.fillRect(px + ps - 22, py + ps - 22, 12, 12);
  },
};

function tag(x, y, txt) {
  ctx.font = "700 11px 'Red Hat Mono', monospace"; ctx.textBaseline = "top";
  const w = ctx.measureText(txt).width + 12;
  ctx.fillStyle = INK; ctx.fillRect(x, y, w, 18);
  ctx.fillStyle = PAPER; ctx.fillText(txt, x + 6, y + 3);
}
function xBox(x, y, r) {
  ctx.strokeStyle = INK; ctx.lineWidth = 1.5;
  ctx.strokeRect(x - r, y - r, r * 2, r * 2);
  ctx.beginPath(); ctx.moveTo(x - r, y - r); ctx.lineTo(x + r, y + r); ctx.moveTo(x + r, y - r); ctx.lineTo(x - r, y + r); ctx.stroke();
  ctx.lineWidth = 1;
}

// ---------------------------------------------------------------------
// SCENE 02 — BARCODE (black/white data, strobe on hard hits)
// ---------------------------------------------------------------------
const sceneBarcode = {
  name: "BARCODE",
  bars: [], flashT: -10, lastFlash: -10, scroll: 0,
  reset() { this.bars = []; },
  spawn(e) {
    const cx = pitchX(e.n) * W;
    const n = Math.round(3 + e.v * 14) * (e.echo ? 0.5 : 1);
    const spread = 30 + e.v * 160;
    for (let k = 0; k < n; k++) {
      const w = Math.random() < 0.2 ? rnd(8, 26) : rnd(1, 5);
      this.bars.push({ x: cx + rnd(-spread, spread), w, life: 1, dec: 1 / (0.15 + releaseTime() * 0.6), band: Math.random() < 0.3 });
    }
    // strobe on hard non-echo hits, rate-limited (max ~3 per second)
    if (!e.echo && e.v > 0.85 && e.t - this.lastFlash > 0.35) { this.flashT = e.t; this.lastFlash = e.t; }
    if (this.bars.length > 900) this.bars.splice(0, this.bars.length - 900);
  },
  draw(dt) {
    const t = V.now;
    const inv = t - this.flashT < 0.07;
    const bg = inv ? PAPER : "#000", fg = inv ? "#000" : PAPER;
    ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
    const midY = H * 0.5, bandH = H * 0.18;
    for (let i = this.bars.length - 1; i >= 0; i--) {
      const b = this.bars[i];
      b.life -= b.dec * dt;
      if (b.life <= 0) { this.bars.splice(i, 1); continue; }
      ctx.globalAlpha = b.life;
      ctx.fillStyle = fg;
      if (b.band) ctx.fillRect(b.x, midY - bandH / 2, b.w, bandH);
      else ctx.fillRect(b.x, 0, b.w, H);
    }
    ctx.globalAlpha = 1;
    // held notes: hairlines with level
    V.notes.forEach(o => {
      const lv = V.level(o); if (lv < 0.01) return;
      ctx.fillStyle = `rgba(255,58,31,${lv})`;
      ctx.fillRect(pitchX(o.n) * W, 0, 1.5, H);
    });
    // data line with scrolling ticks (speed follows clock)
    const speed = V.bpm ? V.bpm * 1.2 : 80;
    this.scroll = (this.scroll + dt * speed) % 40;
    ctx.fillStyle = fg; ctx.fillRect(0, midY, W, 1);
    for (let x = -this.scroll; x < W; x += 40) ctx.fillRect(x, midY - 4, 1, 9);
    // fold -> noise scanlines
    const nz = Math.round(Math.max(0, bp(11)) * 60 + pv(2) * 10);
    for (let k = 0; k < nz; k++) {
      ctx.globalAlpha = Math.random() * 0.6;
      ctx.fillRect(0, Math.random() * H, W, 1);
    }
    ctx.globalAlpha = 1;
    // readouts
    ctx.font = "600 11px 'Red Hat Mono', monospace"; ctx.textBaseline = "top";
    ctx.fillStyle = fg;
    const e = V.log[0];
    ctx.fillText(e ? `${noteName(e.n)} / ${String(Math.round(e.v * 127)).padStart(3, "0")} / CH${e.ch}` : "WAITING FOR SIGNAL", 24, H - 60);
    ctx.fillText(`LP ${String(S.vals[1]).padStart(3, "0")}  RES ${String(S.vals[2]).padStart(3, "0")}  FOLD ${String(S.vals[11] - 64).padStart(3, " ")}  XY ${S.x}.${S.y}`, 24, H - 42);
    const bAge = t - V.beatT;
    ctx.fillStyle = bAge < 0.1 ? RED : fg;
    ctx.fillRect(W - 40, H - 58, 14, 14);
  },
};



// ---------------------------------------------------------------------
// SCENE 03 — FALL (piano-roll waterfall as raw pixel data)
// ---------------------------------------------------------------------
const sceneFall = {
  name: "FALL",
  oc: null, octx: null, acc: 0, onsets: [],
  reset() {
    this.oc = document.createElement("canvas"); this.oc.width = 128; this.oc.height = 200;
    this.octx = this.oc.getContext("2d"); this.octx.fillStyle = "#000"; this.octx.fillRect(0, 0, 128, 200);
    this.onsets = []; this.acc = 0;
  },
  spawn(e) { this.onsets.push(e); },
  draw(dt) {
    if (!this.oc) this.reset();
    const o = this.octx;
    const speed = V.bpm ? V.bpm / 60 * 16 : 32;      // one row per 16th note
    this.acc += dt * speed;
    let rows = Math.floor(this.acc); this.acc -= rows; rows = Math.min(rows, 20);
    if (rows > 0) {
      o.drawImage(this.oc, 0, 0, 128, 200 - rows, 0, rows, 128, 200 - rows);
      o.fillStyle = "#000"; o.fillRect(0, 0, 128, rows);
      V.notes.forEach(n => {
        const lv = V.level(n); if (lv < 0.02) return;
        o.fillStyle = `rgba(230,230,227,${clamp(lv * 1.3, 0, 1)})`; o.fillRect(n.n, 0, 1, rows);
      });
      this.onsets.forEach(ev => { o.fillStyle = ev.echo ? "rgba(230,230,227,.45)" : RED; o.fillRect(ev.n, 0, 1, 1); });
      this.onsets = [];
    }
    const lo = 24, span = 84;                          // C1..B7
    ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(this.oc, lo, 0, span, 200, 0, 0, W, H);
    ctx.imageSmoothingEnabled = true;
    ctx.font = "600 10px 'Red Hat Mono', monospace"; ctx.textBaseline = "top";
    for (let n = lo; n <= lo + span; n++) {
      const x = (n - lo) / span * W;
      if (n % 12 === 0) {
        ctx.fillStyle = "rgba(230,230,227,.16)"; ctx.fillRect(x, 0, 1, H);
        ctx.fillStyle = PAPER; ctx.fillText("C" + (n / 12 - 1), x + 4, H - 82);
      } else { ctx.fillStyle = "rgba(230,230,227,.4)"; ctx.fillRect(x, H - 6, 1, 6); }
    }
    readout(PAPER);
  },
};

// ---------------------------------------------------------------------
// SCENE 04 — SCAN (bar-synced sweep, bit-coded pitch lines)
// ---------------------------------------------------------------------
const sceneScan = {
  name: "SCAN",
  trail: null, tctx: null, cx: 0, flashes: [],
  reset() {
    this.trail = document.createElement("canvas");
    this.trail.width = Math.max(1, Math.round(W)); this.trail.height = Math.max(1, Math.round(H));
    this.tctx = this.trail.getContext("2d"); this.tctx.fillStyle = "#000"; this.tctx.fillRect(0, 0, W, H);
    this.flashes = []; this.cx = 0;
  },
  py(n) { return (1 - (n - 24) / 84) * H * 0.78 + H * 0.06; },
  spawn(e) {
    this.flashes.push({ n: e.n, v: e.v, t: e.t, echo: e.echo });
    if (this.tctx) {                                   // permanent onset mark in the trail
      const h = 4 + e.v * 22;
      this.tctx.fillStyle = e.echo ? "rgba(230,230,227,.5)" : "#fff";
      this.tctx.fillRect(this.cx - 1, this.py(e.n) - h / 2, e.echo ? 1 : 3, h);
    }
  },
  draw(dt) {
    if (!this.trail || this.trail.width !== Math.round(W) || this.trail.height !== Math.round(H)) this.reset();
    const t = V.now, T = this.tctx;
    const bar = V.bpm ? 240 / V.bpm : 2;               // one screen per bar
    const prev = this.cx;
    this.cx = (this.cx + dt / bar * W) % W;
    T.fillStyle = "rgba(0,0,0,.012)"; T.fillRect(0, 0, W, H);
    const w = this.cx >= prev ? this.cx - prev + 1 : 2;
    V.notes.forEach(o => {
      const lv = V.level(o); if (lv < 0.02) return;
      T.fillStyle = `rgba(230,230,227,${lv})`; T.fillRect(this.cx - w, this.py(o.n) - 1, w, 2 + lv * 5);
    });
    ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
    ctx.drawImage(this.trail, 0, 0, W, H);
    // held notes: horizontal lines, segment pattern = bits of the note number
    const seg = 10, scroll = t * (V.bpm || 100) * 0.8, off = scroll % seg, k0 = Math.floor(scroll / seg);
    V.notes.forEach(o => {
      const lv = V.level(o); if (lv < 0.02) return;
      const y = this.py(o.n), h = 1 + lv * 6, bits = Math.imul(o.n + 1, 2654435761) >>> 0;
      ctx.fillStyle = `rgba(230,230,227,${lv * 0.8})`;
      for (let x = -off, k = k0; x < W; x += seg, k++) if ((bits >>> (k & 31)) & 1) ctx.fillRect(x, y - h / 2, seg - 2, h);
    });
    // onsets: full-width flash line + note label at the cursor
    ctx.font = "700 12px 'Red Hat Mono', monospace"; ctx.textBaseline = "top";
    for (let i = this.flashes.length - 1; i >= 0; i--) {
      const f = this.flashes[i], a = (t - f.t) / 0.4;
      if (a >= 1) { this.flashes.splice(i, 1); continue; }
      const y = this.py(f.n), h = (1 + f.v * 10) * (1 - a);
      ctx.fillStyle = f.echo ? `rgba(230,230,227,${(1 - a) * 0.35})` : `rgba(255,255,255,${1 - a})`;
      ctx.fillRect(0, y - h / 2, W, h);
      if (!f.echo && a < 0.6) { ctx.fillStyle = RED; ctx.fillText(noteName(f.n), this.cx + 8, y - 18); }
    }
    ctx.fillStyle = RED; ctx.fillRect(this.cx, 0, 1, H);
    ctx.font = "600 10px 'Red Hat Mono', monospace"; ctx.fillStyle = "rgba(230,230,227,.55)";
    for (let n = 24; n <= 108; n += 12) { const y = this.py(n); ctx.fillRect(0, y, 8, 1); ctx.fillText("C" + (n / 12 - 1), 12, y - 5); }
    readout(PAPER);
  },
};

// ---------------------------------------------------------------------
// SCENE 05 — HEX (raw MIDI bytes written into a flickering data field)
// ---------------------------------------------------------------------
const sceneHex = {
  name: "HEX",
  cells: null, w: 0, h: 0, last: null,
  reset() {
    this.fs = W > 900 ? 15 : 12; this.cw = this.fs * 1.9; this.chh = this.fs * 1.5;
    this.cols = Math.max(1, Math.floor((W - 48) / this.cw));
    this.rows = Math.max(1, Math.floor((H - 190) / this.chh));
    const n = this.cols * this.rows;
    this.cells = new Uint8Array(n); this.lum = new Float32Array(n); this.hot = new Float32Array(n);
    for (let i = 0; i < n; i++) this.cells[i] = (Math.random() * 256) | 0;
    this.cur = 0; this.w = W; this.h = H;
  },
  spawn() {},
  onRaw(b) {
    if (!this.cells) return;
    const n = this.cells.length;
    b.forEach((x, k) => { const i = this.cur; this.cells[i] = x; this.lum[i] = 1; this.hot[i] = k === 0 ? 1 : 0.6; this.cur = (i + 1) % n; });
    this.cur = (this.cur + 1) % n;
    this.last = { b, t: V.now };
  },
  draw(dt) {
    if (!this.cells || this.w !== W || this.h !== H) this.reset();
    const n = this.cells.length;
    const flicker = Math.round(3 + Math.max(0, bp(11)) * 60 + pv(2) * 20);
    for (let k = 0; k < flicker; k++) { const i = (Math.random() * n) | 0; this.cells[i] = (Math.random() * 256) | 0; this.lum[i] = Math.max(this.lum[i], 0.22); }
    const dl = Math.exp(-dt / (0.3 + releaseTime())), dh = Math.exp(-dt / 0.15);
    ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
    ctx.font = `600 ${this.fs}px 'Red Hat Mono', monospace`; ctx.textBaseline = "top";
    const x0 = 24, y0 = 64;
    for (let i = 0; i < n; i++) {
      this.lum[i] *= dl; this.hot[i] *= dh;
      const x = x0 + (i % this.cols) * this.cw, y = y0 + Math.floor(i / this.cols) * this.chh;
      ctx.fillStyle = this.hot[i] > 0.3 ? RED : `rgba(230,230,227,${0.08 + this.lum[i] * 0.92})`;
      ctx.fillText(hex2(this.cells[i]), x, y);
    }
    // write cursor, blinks on the beat
    const ci = this.cur;
    ctx.fillStyle = V.now - V.beatT < 0.12 ? RED : "rgba(230,230,227,.6)";
    ctx.fillRect(x0 + (ci % this.cols) * this.cw, y0 + Math.floor(ci / this.cols) * this.chh + this.fs + 2, this.fs * 1.3, 2);
    // last message, big
    const by = y0 + this.rows * this.chh + 14;
    if (this.last) {
      const fresh = V.now - this.last.t < 0.15;
      const big = Math.min(44, W * 0.045);
      ctx.fillStyle = fresh ? RED : PAPER;
      ctx.font = `${big}px Boldonse, 'Arial Black', sans-serif`;
      ctx.fillText(this.last.b.map(hex2).join(" "), 24, by);
      ctx.font = "600 12px 'Red Hat Mono', monospace"; ctx.fillStyle = PAPER;
      ctx.fillText(describe(this.last.b), 24, by + big * 1.5);
    } else {
      ctx.font = "600 12px 'Red Hat Mono', monospace"; ctx.fillStyle = PAPER;
      ctx.fillText("WAITING FOR SIGNAL", 24, by);
    }
  },
};

// ---------------------------------------------------------------------
// PALETTES — ambient scenes use the active palette.
// A panel can push its own colours via SysEx (see PALETTE_SYSEX below);
// otherwise pick one with the PALETTE button.
// ---------------------------------------------------------------------
const PALETTES = [
  { name: "DUSK",    bg: [14, 10, 24],  c: [[255, 58, 31], [255, 150, 70], [120, 60, 160]] },
  { name: "TIDE",    bg: [4, 14, 22],   c: [[30, 120, 150], [90, 200, 190], [210, 235, 225]] },
  { name: "MOSS",    bg: [8, 16, 10],   c: [[60, 140, 80], [170, 200, 90], [230, 220, 160]] },
  { name: "EMBER",   bg: [18, 6, 4],    c: [[255, 110, 20], [255, 190, 60], [200, 30, 30]] },
  { name: "AURORA",  bg: [4, 8, 20],    c: [[40, 220, 140], [60, 120, 255], [190, 80, 230]] },
  { name: "PAPER",   bg: [30, 30, 29],  c: [[230, 230, 227], [160, 160, 155], [255, 58, 31]] },
];
// SysEx: F0 7D 50 4C n  r1 g1 b1  r2 g2 b2 ... F7   (7D = non-commercial ID, "PL")
// values 0..127 (scaled x2), first colour = background, then up to 3 accents.
let palIdx = 0, palPanel = null;
try { const v = +localStorage.getItem(STORE_KEY + ".pal"); if (v >= 0 && v < PALETTES.length) palIdx = v; } catch (e) {}
const pal = () => palPanel || PALETTES[palIdx];
function onSysex(d) {
  if (d.length < 9 || d[1] !== 0x7D || d[2] !== 0x50 || d[3] !== 0x4C) return;
  const n = d[4], cols = [];
  for (let k = 0; k < n && 5 + k * 3 + 2 < d.length - 1; k++) cols.push([d[5 + k * 3] * 2, d[6 + k * 3] * 2, d[7 + k * 3] * 2]);
  if (cols.length < 2) return;
  palPanel = { name: "PANEL", bg: cols[0], c: cols.slice(1, 4) };
  while (palPanel.c.length < 3) palPanel.c.push(palPanel.c[palPanel.c.length - 1]);
  updatePalBtn();
}
const rgba = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;
const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const pitchCol = n => { const p = pal().c, t = ((n % 12) / 12) * 3; const i = Math.floor(t); return mix(p[i % 3], p[(i + 1) % 3], t - i); };

// low-res buffer, upscaled with smoothing -> naturally soft gradients
function softBuffer(o, w, h) {
  if (!o.buf || o.buf.width !== w || o.buf.height !== h) {
    o.buf = document.createElement("canvas"); o.buf.width = w; o.buf.height = h; o.bctx = o.buf.getContext("2d");
  }
  return o.bctx;
}
function blit(o) {
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
  ctx.drawImage(o.buf, 0, 0, W, H);
}

// ---------------------------------------------------------------------
// SCENE 06 — NEBEL (drifting colour fields, notes bloom softly)
// ---------------------------------------------------------------------
const sceneNebel = {
  name: "NEBEL",
  blobs: [], glows: [], energy: 0,
  reset() {
    this.blobs = [];
    for (let k = 0; k < 5; k++) this.blobs.push({ x: Math.random(), y: Math.random(), r: rnd(0.35, 0.6), ci: k % 3, ph: Math.random() * 6.28, sp: rnd(0.02, 0.05) });
    this.glows = [];
  },
  spawn(e) {
    this.glows.push({ x: pitchX(e.n), y: 0.85 - e.v * 0.6, r: 0.12 + e.v * 0.25, c: pitchCol(e.n), t: e.t, v: e.v * (e.echo ? 0.4 : 1) });
    this.energy = Math.min(1, this.energy + e.v * 0.25);
    if (this.glows.length > 40) this.glows.shift();
  },
  draw(dt) {
    if (!this.blobs.length) this.reset();
    const t = V.now, P = pal(), bw = 96, bh = Math.max(32, Math.round(96 * H / W));
    const b = softBuffer(this, bw, bh);
    this.energy *= Math.exp(-dt / 4);
    b.globalCompositeOperation = "source-over";
    b.fillStyle = rgba(P.bg, 1); b.fillRect(0, 0, bw, bh);
    b.globalCompositeOperation = "lighter";
    const drift = 0.6 + pv(14) * 0.8;                    // reverb = wider, slower float
    const ox = (S.x - 64) / 64 * 0.15, oy = (S.y - 64) / 64 * 0.15;
    this.blobs.forEach((o, k) => {
      const s = t * o.sp * drift;
      const x = (o.x + Math.sin(s + o.ph) * 0.25 + ox * (k % 2 ? 1 : -1)) * bw;
      const y = (o.y + Math.cos(s * 0.8 + o.ph * 1.3) * 0.25 - oy) * bh;
      const r = o.r * bw * (1 + this.energy * 0.25 + Math.sin(t * 0.3 + k) * 0.06);
      const g = b.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, rgba(P.c[o.ci], 0.22 + this.energy * 0.12));
      g.addColorStop(1, rgba(P.c[o.ci], 0));
      b.fillStyle = g; b.fillRect(0, 0, bw, bh);
    });
    // held notes: steady soft light
    V.notes.forEach(o => {
      const lv = V.level(o); if (lv < 0.02) return;
      const x = pitchX(o.n) * bw, y = (0.8 - o.v * 0.5) * bh, r = (0.18 + lv * 0.2) * bw;
      const g = b.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, rgba(pitchCol(o.n), lv * 0.35)); g.addColorStop(1, rgba(pitchCol(o.n), 0));
      b.fillStyle = g; b.fillRect(0, 0, bw, bh);
    });
    // onsets: slow bloom, long fade (release fader)
    const life = 2.5 + releaseTime() * 2;
    for (let i = this.glows.length - 1; i >= 0; i--) {
      const q = this.glows[i], a = (t - q.t) / life;
      if (a >= 1) { this.glows.splice(i, 1); continue; }
      const env = Math.sin(Math.min(1, a * 4) * Math.PI / 2) * (1 - a) * (1 - a);
      const x = q.x * bw, y = (q.y - a * 0.08) * bh, r = q.r * bw * (1 + a * 1.5);
      const g = b.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, rgba(q.c, env * q.v * 0.5)); g.addColorStop(1, rgba(q.c, 0));
      b.fillStyle = g; b.fillRect(0, 0, bw, bh);
    }
    blit(this);
    // gentle vignette
    const vg = ctx.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.3, W / 2, H / 2, Math.max(W, H) * 0.75);
    vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,.45)");
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
    ambientLabel(P);
  },
};

// ---------------------------------------------------------------------
// SCENE 07 — HORIZONT (layered gradient bands, slow light curtains)
// ---------------------------------------------------------------------
const sceneHorizont = {
  name: "HORIZONT",
  lift: new Float32Array(6), swells: [],
  reset() { this.lift.fill(0); this.swells = []; },
  spawn(e) {
    const band = clamp(Math.floor(((e.n - 24) / 84) * 6), 0, 5);
    this.lift[5 - band] = Math.min(1, this.lift[5 - band] + e.v * (e.echo ? 0.15 : 0.5));
    if (!e.echo) this.swells.push({ x: pitchX(e.n), c: pitchCol(e.n), t: e.t, v: e.v });
    if (this.swells.length > 24) this.swells.shift();
  },
  draw(dt) {
    const t = V.now, P = pal(), bw = 128, bh = Math.max(40, Math.round(128 * H / W));
    const b = softBuffer(this, bw, bh);
    // sky: vertical gradient from background into first accent near the horizon
    const hz = 0.62 - (S.y - 64) / 64 * 0.12;             // XY: Y moves the horizon
    const sky = b.createLinearGradient(0, 0, 0, bh);
    sky.addColorStop(0, rgba(P.bg, 1));
    sky.addColorStop(hz * 0.7, rgba(mix(P.bg, P.c[2], 0.35), 1));
    sky.addColorStop(hz, rgba(mix(P.c[0], P.c[1], 0.5), 1));
    sky.addColorStop(Math.min(1, hz + 0.04), rgba(mix(P.bg, P.c[0], 0.5), 1));
    sky.addColorStop(1, rgba(P.bg, 1));
    b.globalCompositeOperation = "source-over";
    b.fillStyle = sky; b.fillRect(0, 0, bw, bh);
    // sun glow, X moves it sideways, breathes with the beat
    const beat = Math.exp(-(t - V.beatT) * 3) * 0.15;
    const sx = (0.2 + S.x / 127 * 0.6) * bw, sy = hz * bh;
    const sg = b.createRadialGradient(sx, sy, 0, sx, sy, bw * (0.35 + beat));
    sg.addColorStop(0, rgba(P.c[1], 0.55)); sg.addColorStop(1, rgba(P.c[1], 0));
    b.globalCompositeOperation = "lighter"; b.fillStyle = sg; b.fillRect(0, 0, bw, bh);
    // light curtains: six soft sine bands, note register lifts its band
    const speed = 0.04 + pv(13) * 0.08;
    for (let k = 0; k < 6; k++) {
      this.lift[k] *= Math.exp(-dt / (1.5 + releaseTime()));
      const c = P.c[k % 3], baseY = (0.12 + k * 0.1) * bh, amp = bh * (0.03 + this.lift[k] * 0.05);
      b.beginPath(); b.moveTo(0, bh);
      for (let x = 0; x <= bw; x += 2) {
        const y = baseY + Math.sin(x * 0.05 + t * speed * (k + 1) + k) * amp + Math.sin(x * 0.013 - t * speed * 0.7 + k * 2) * amp * 1.6;
        b.lineTo(x, y);
      }
      b.lineTo(bw, bh); b.closePath();
      const g = b.createLinearGradient(0, baseY - amp * 3, 0, baseY + bh * 0.18);
      g.addColorStop(0, rgba(c, 0)); g.addColorStop(0.35, rgba(c, 0.07 + this.lift[k] * 0.22)); g.addColorStop(1, rgba(c, 0));
      b.fillStyle = g; b.fill();
    }
    // onsets: tall soft light pillars that rise and fade
    for (let i = this.swells.length - 1; i >= 0; i--) {
      const q = this.swells[i], a = (t - q.t) / (3 + releaseTime() * 2);
      if (a >= 1) { this.swells.splice(i, 1); continue; }
      const env = Math.sin(Math.min(1, a * 5) * Math.PI / 2) * (1 - a);
      const x = q.x * bw, w = bw * (0.04 + q.v * 0.06) * (1 + a);
      const g = b.createLinearGradient(x - w, 0, x + w, 0);
      g.addColorStop(0, rgba(q.c, 0)); g.addColorStop(0.5, rgba(q.c, env * q.v * 0.35)); g.addColorStop(1, rgba(q.c, 0));
      b.fillStyle = g; b.fillRect(x - w, 0, w * 2, hz * bh);
    }
    // water: mirrored, darker, below the horizon
    b.globalCompositeOperation = "source-over";
    const wy = Math.round(hz * bh) + 1;
    if (wy < bh) {
      b.save(); b.globalAlpha = 0.35; b.translate(0, wy * 2); b.scale(1, -1);
      b.drawImage(this.buf, 0, 0, bw, wy, 0, 0, bw, wy); b.restore();
      const wg = b.createLinearGradient(0, wy, 0, bh);
      wg.addColorStop(0, rgba(P.bg, 0.25)); wg.addColorStop(1, rgba(P.bg, 0.9));
      b.fillStyle = wg; b.fillRect(0, wy, bw, bh - wy);
    }
    blit(this);
    // fine shimmer lines on the water
    ctx.fillStyle = rgba(P.c[1], 0.12);
    const hy = hz * H;
    for (let k = 0; k < 18; k++) {
      const y = hy + 6 + Math.pow(k / 18, 1.6) * (H - hy);
      const w = 40 + (Math.sin(t * 0.5 + k * 1.7) * 0.5 + 0.5) * W * 0.25;
      ctx.fillRect(S.x / 127 * W * 0.6 + W * 0.2 - w / 2 + Math.sin(t * 0.3 + k) * 20, y, w, 1);
    }
    ambientLabel(P);
  },
};

function ambientLabel(P) {
  ctx.font = "600 11px 'Red Hat Mono', monospace"; ctx.textBaseline = "top";
  ctx.fillStyle = "rgba(255,255,255,.35)";
  const e = V.log[0];
  ctx.fillText(`${P.name}${e ? "  ·  " + noteName(e.n) : ""}`, 24, H - 36);
}

const SCENES = [sceneEvents, sceneBarcode, sceneFall, sceneScan, sceneHex, sceneNebel, sceneHorizont];
let cur = 0;
const scenesEl = document.getElementById("scenes");
const sceneBtns = SCENES.map((s, k) => {
  const b = document.createElement("button");
  b.className = "btn"; b.textContent = String(k + 1).padStart(2, "0") + " " + s.name;
  b.onclick = () => setScene(k);
  scenesEl.appendChild(b); return b;
});
let setScene = function (k) {
  if (SCENES[cur] && SCENES[cur].reset && cur !== k) SCENES[cur].reset();
  cur = k; SCENES[k].reset && SCENES[k].reset();
  sceneBtns.forEach((b, i) => b.classList.toggle("cur", i === k));
}
setScene(0);

// Stage pointer: scenes may claim it (EVENTS XY pad), otherwise tap = visual-only note
const tapNotes = new Map();
function stagePos(e) { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
cv.addEventListener("pointerdown", e => {
  const [x, y] = stagePos(e), sc = SCENES[cur];
  cv.setPointerCapture(e.pointerId);
  if (sc.pointer && sc.pointer("down", e, x, y)) return;
  const n = clamp(Math.round(24 + (x / W - 0.06) / 0.88 * 72), 0, 127);
  const v = clamp(Math.round((1 - y / H) * 127), 20, 127);
  tapNotes.set(e.pointerId, n); V.noteOn(n, v, 16);
});
cv.addEventListener("pointermove", e => { const sc = SCENES[cur]; if (sc.pointer) { const [x, y] = stagePos(e); sc.pointer("move", e, x, y); } });
const tapEnd = e => {
  const sc = SCENES[cur];
  if (sc.pointer) { const [x, y] = stagePos(e); sc.pointer("up", e, x, y); }
  if (tapNotes.has(e.pointerId)) { V.noteOff(tapNotes.get(e.pointerId), 16); tapNotes.delete(e.pointerId); }
};
cv.addEventListener("pointerup", tapEnd);
cv.addEventListener("pointercancel", tapEnd);


// Demo mode: random pentatonic notes + fake clock (visual only, sends nothing)
let demo = false, demoNext = 0, demoTick = 0;
const demoOff = [];
const bDemo = document.getElementById("bDemo");
function setDemo(on) { demo = on; bDemo.classList.toggle("cur", on); if (!on) V.bpm = 0; }
bDemo.onclick = () => setDemo(!demo);
function runDemo() {
  if (!demo) return;
  const t = V.now, step = 0.25;      // 120 BPM eighths
  if (t >= demoNext) {
    demoNext = t + step; demoTick++;
    if (demoTick % 2 === 0) { V.bpm = 120; V.beatNow(); }
    if (Math.random() < 0.65) {
      const sc = [0, 3, 5, 7, 10];
      const n = 48 + sc[(Math.random() * 5) | 0] + 12 * ((Math.random() * 3) | 0);
      const v = Math.random() < 0.15 ? 127 : Math.round(rnd(40, 110));
      V.noteOn(n, v, 1); demoOff.push({ n, at: t + rnd(0.1, 0.6) });
    }
  }
  for (let k = demoOff.length - 1; k >= 0; k--) if (t >= demoOff[k].at) { V.noteOff(demoOff[k].n, 1); demoOff.splice(k, 1); }
}

// Palette button: cycles presets (a panel palette via SysEx takes priority until tapped)
const bPal = document.getElementById("bPal");
function updatePalBtn() { bPal.textContent = "◐ " + pal().name; bPal.style.display = SCENES[cur].ambient ? "" : "none"; }
bPal.onclick = () => {
  if (palPanel) palPanel = null; else palIdx = (palIdx + 1) % PALETTES.length;
  try { localStorage.setItem(STORE_KEY + ".pal", palIdx); } catch (e) {}
  updatePalBtn();
};
sceneNebel.ambient = sceneHorizont.ambient = true;
const _setScene = setScene;
setScene = k => { _setScene(k); updatePalBtn(); };
updatePalBtn();

// Hide UI (fullscreen visuals)
document.getElementById("bHide").onclick = () => {
  document.body.classList.toggle("hide");
  document.getElementById("bHide").textContent = document.body.classList.contains("hide") ? "SHOW UI" : "HIDE UI";
  resize();
};

// =====================================================================
// MAIN LOOP
// =====================================================================
let lastMs = performance.now();
function frame(ms) {
  const dt = Math.min(0.05, (ms - lastMs) / 1000); lastMs = ms;
  V.now = ms / 1000;
  flushCC();
  runDemo();
  V.update();
  if (document.getElementById("visual").classList.contains("on")) {
    if (cv.width < 2) resize();
    SCENES[cur].draw(dt);
  }
  if (midi && midi.inputs.size) dot.className = "dot " + (ms - hitT < 80 ? "hit" : "ok");
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);
</script>
</body>
